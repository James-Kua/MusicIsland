<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MusicIsland brings live lyrics, artwork, and playback controls to your Mac menu bar."
    />
    <meta name="theme-color" content="#070809" />
    <link rel="icon" type="image/png" href="/musicisland-icon.png" />
    <title>MusicIsland — Your music, at a glance.</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("musicisland-theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : prefersLight
              ? "light"
              : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
